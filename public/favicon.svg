<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 3D matte rubber sphere gradient -->
    <radialGradient id="squashRubber" cx="36%" cy="32%" r="64%">
      <stop offset="0%" stop-color="#3f424a"/>
      <stop offset="40%" stop-color="#22242a"/>
      <stop offset="80%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#090a0c"/>
    </radialGradient>
    
    <!-- Yellow dot gradient -->
    <radialGradient id="squashDot" cx="38%" cy="35%" r="62%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    
    <!-- High contrast outer glow -->
    <filter id="yellowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.8" flood-color="#facc15" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Contrast ring for dark and light browser tabs -->
  <circle cx="32" cy="32" r="31" fill="#090a0c" opacity="0.3"/>
  <circle cx="32" cy="32" r="29.5" fill="#18181b" stroke="#52525b" stroke-width="1.2"/>

  <!-- Rubber squash ball body -->
  <circle cx="32" cy="32" r="28" fill="url(#squashRubber)"/>

  <!-- Subtle rubber light reflection -->
  <path d="M 16 26 A 22 22 0 0 1 38 12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.16"/>

  <!-- Double Yellow Dot (Official Tournament Squash Ball) -->
  <circle cx="26.5" cy="33" r="3.4" fill="url(#squashDot)" filter="url(#yellowGlow)"/>
  <circle cx="37.5" cy="33" r="3.4" fill="url(#squashDot)" filter="url(#yellowGlow)"/>
</svg>